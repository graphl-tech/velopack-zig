name: package

on:
  # A PR already runs on `pull_request`; running on every branch push too just
  # pays for the same check twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is macOS 26, whose SDK Zig 0.15.2 cannot link against —
        # it fails while building its own build runner, before this package is
        # reached. Unpin once we are on a Zig that supports it.
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7

      # Velopack's CLI is a .NET tool; velopack-zig installs it itself when
      # -Dinstall-vpk=true, but it needs an SDK to install it with.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: ${{ matrix.os }}

      - run: ./test/package.sh
        shell: bash
