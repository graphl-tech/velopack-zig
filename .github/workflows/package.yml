name: package

on:
  # A PR already runs on `pull_request`; running on every branch push too just
  # pays for the same check twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Velopack's CLI is a .NET tool; velopack-zig installs it itself when
      # -Dinstall-vpk=true, but it needs an SDK to install it with.
      - uses: actions/setup-dotnet@v6
        with:
          # vpk 1.2 targets .NET 10.
          dotnet-version: '10.0.x'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: ${{ matrix.os }}

      - run: ./test/package.sh
        shell: bash
